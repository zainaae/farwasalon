name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (with coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  indexnow:
    name: IndexNow ping (master only)
    needs: verify
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ping IndexNow priority URLs
        run: npm run ping:indexnow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

  lighthouse:
    runs-on: ubuntu-latest
    # Category budgets are errors (median of 3 runs, see lighthouserc.json).
    # Perf floor is 0.65: throttled CI runners score ~0.73-0.78 on pages that
    # do better on real devices, so 0.65 catches regressions without flake.
    # Individual metric budgets (LCP/CLS/TBT) stay warn — runners are noisy.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: npx --yes @lhci/cli autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 14
