<!-- @dsCard group="Spacing" viewport="700x180" name="Section shell" subtitle="80rem max-width shell + 44px tap floor" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 0;background:var(--mist);font-family:var(--font-inter)}</style></head>
<body>
<div style="background:#fff;border-block:1px solid var(--border-soft)">
  <div class="section-shell" style="border-inline:1px dashed var(--accent-gold);padding-block:18px">
    <p style="margin:0;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone)">.section-shell — max-width 80rem, padding-inline 16 / 20 / 40px</p>
    <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
      <span style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;border:1px dashed rgba(13,13,13,.3);font-size:9px;color:var(--stone)">44px</span>
      <span style="font-size:10px;font-weight:300;color:var(--stone)">Every interactive element ≥ 44px hit target (.tap-safe)</span>
    </div>
  </div>
</div>
</body></html>
