<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:#fff}.row{display:flex;gap:8px}.sw{flex:1;height:78px;border:1px solid var(--border-soft);display:flex;flex-direction:column;justify-content:flex-end;padding:8px}.sw b{font-family:var(--font-inter);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}.sw span{font-family:var(--font-inter);font-size:10px;font-weight:300}</style></head>
<body><div class="row">
<div class="sw" style="background:#ffffff"><b style="color:#0d0d0d">white</b><span style="color:#6b5f57">#ffffff</span></div>
<div class="sw" style="background:#f8f5f1"><b style="color:#0d0d0d">mist</b><span style="color:#6b5f57">#f8f5f1</span></div>
<div class="sw" style="background:#f5f2ec"><b style="color:#0d0d0d">cream</b><span style="color:#6b5f57">#f5f2ec</span></div>
<div class="sw" style="background:#e8ddd5"><b style="color:#0d0d0d">nude</b><span style="color:#6b5f57">#e8ddd5</span></div>
<div class="sw" style="background:#6b5f57"><b style="color:#fff">stone</b><span style="color:rgba(255,255,255,.8)">#6b5f57</span></div>
<div class="sw" style="background:#0d0d0d"><b style="color:#fff">ink</b><span style="color:rgba(255,255,255,.7)">#0d0d0d</span></div>
</div></body></html>
