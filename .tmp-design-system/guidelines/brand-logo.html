<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:#fff;display:flex;gap:12px;font-family:var(--font-inter)}.half{flex:1;height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1px solid var(--border-soft)}.l{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone)}</style></head>
<body>
<div class="half" style="background:#fff"><img src="../assets/logo.jpg" alt="Farwa Beauty Salon logo" style="height:44px;width:auto;object-fit:contain"><span class="l">assets/logo.jpg — light grounds</span></div>
<div class="half" style="background:var(--ink)"><span style="font-family:var(--font-unbounded);font-weight:700;font-size:16px;letter-spacing:.16em;color:#fff">FARWA</span><span class="l" style="color:rgba(255,255,255,.5)">wordmark — dark grounds</span></div>
</body></html>
