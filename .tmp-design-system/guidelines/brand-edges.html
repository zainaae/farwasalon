<!-- @dsCard group="Brand" viewport="700x250" name="Torn edges & grain" subtitle="Band transitions — torn edge + barely-there noise" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--mist);font-family:var(--font-inter)}</style></head>
<body>
<div style="background:#fff;padding:16px 24px 8px"><span style="font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone)">White band</span></div>
<span class="edge-tear" style="color:#0d0d0d;background:#fff"></span>
<div class="grain grain--on-dark" style="background:var(--ink);padding:20px 24px 24px"><span style="font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-gold)">Ink band — .grain adds 5% noise</span></div>
<span class="edge-tear edge-tear--flip" style="color:#0d0d0d;background:var(--nude)"></span>
<div class="grain" style="background:var(--nude);padding:20px 24px"><span style="font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone)">Nude band</span></div>
<p style="margin:0;padding:12px 24px;font-size:10px;font-weight:300;color:var(--stone);line-height:1.6">.edge-tear — color = the torn band, background = its neighbour. Use at most twice per page; hairlines still do everyday structure.</p>
</body></html>
