<!-- @dsCard group="Brand" viewport="700x210" name="Imagery" subtitle="Warm salon photography; matted frames; gradient-protected type" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 20px;background:#fff;display:flex;gap:10px}.mat{border:1px solid var(--border-soft);background:#fff;padding:3px;flex:1}.mat img{display:block;width:100%;height:140px;object-fit:cover}.hero{flex:1.6;position:relative;overflow:hidden}.hero img{display:block;width:100%;height:148px;object-fit:cover}.ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(13,6,9,.88) 0%,rgba(13,6,9,.44) 34%,rgba(13,6,9,.1) 70%)}.cap{position:absolute;left:12px;bottom:10px;color:#fff;font-family:var(--font-unbounded);font-weight:700;font-size:15px;letter-spacing:-.02em;text-shadow:0 1px 14px rgba(0,0,0,.4)}.eb{position:absolute;left:12px;bottom:34px;color:rgba(255,255,255,.8);font-family:var(--font-inter);font-size:8px;letter-spacing:.3em;text-transform:uppercase}</style></head>
<body>
<div class="hero"><img src="../assets/bridal2.jpg" alt="Bridal styling"><div class="ov"></div><span class="eb">Est. 2008</span><span class="cap">Bridal in PECHS</span></div>
<div class="mat"><img src="../assets/threading.jpg" alt="Threading"></div>
<div class="mat"><img src="../assets/pedicure.jpg" alt="Pedicure"></div>
</body></html>
