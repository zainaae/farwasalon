<!-- @dsCard group="Type" viewport="700x170" name="Numbers & prices" subtitle="Rs formatting, tabular nums, inline ratings" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:#fff;display:flex;gap:32px;align-items:center;font-family:var(--font-inter)}.b{display:flex;flex-direction:column;gap:4px}.l{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone)}</style></head>
<body>
<div class="b"><span class="l">from price</span><span><span style="display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--stone)">from</span><span style="font-family:var(--font-unbounded);font-weight:700;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums">Rs 1,400</span></span></div>
<div class="b"><span class="l">hair-dependent</span><span style="font-size:14px;font-weight:500;color:var(--accent-gold-deep)">from Rs 4,000</span></div>
<div class="b"><span class="l">rating</span><span style="font-family:var(--font-unbounded);font-weight:700;font-size:20px;color:var(--ink)">4.6★</span></div>
<div class="b"><span class="l">duration</span><span style="font-size:14px;color:var(--stone)">1h 30m &nbsp;·&nbsp; 10 min</span></div>
<div class="b" style="max-width:180px"><span class="l">rule</span><span style="font-size:10px;font-weight:300;color:var(--stone);line-height:1.5">Comma-separated PKR, never rounded up. "from" only when hair-dependent.</span></div>
</body></html>
