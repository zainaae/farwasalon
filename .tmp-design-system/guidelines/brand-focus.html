<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:#fff;display:flex;gap:28px;align-items:center;font-family:var(--font-inter)}.b{display:flex;flex-direction:column;gap:8px}.l{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone)}.ringed{outline:2px solid var(--accent-gold-deep);outline-offset:3px;border-radius:1px}</style></head>
<body>
<div class="b"><span class="l">focus-visible ring</span><button class="btn-primary ringed" style="pointer-events:none">Book an Appointment</button></div>
<div class="b"><span class="l">selection</span><span class="text-body" style="max-width:220px"><mark style="background:rgba(201,169,138,.35);color:#0d0d0d">Every starting price printed</mark> from Rs 100.</span></div>
<div class="b" style="max-width:190px"><span class="l">rule</span><span style="font-size:10px;font-weight:300;color:var(--stone);line-height:1.5">2px #82664a outline, offset 3px, on every interactive element. Never the pale gold — it fails 3:1.</span></div>
</body></html>
