<!-- @dsCard group="Spacing" viewport="700x190" name="Flow scale" subtitle="28 / 48 / 96px margin steps — 1.7x and 2x" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:#fff;font-family:var(--font-inter)}.r{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:16px;margin-bottom:10px}.l{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone)}.bar{height:16px;background:var(--nude);border:1px solid var(--border-soft);display:flex;align-items:center;padding-left:8px;font-size:10px;color:var(--stone)}</style></head>
<body>
<div class="r"><span class="l">flow-tight</span><div class="bar" style="width:28px"></div></div>
<div class="r"><span class="l">flow</span><div class="bar" style="width:48px"></div></div>
<div class="r"><span class="l">flow-loose</span><div class="bar" style="width:96px">96px (120px ≥ md)</div></div>
<p style="font-size:10px;font-weight:300;color:var(--stone);margin:12px 2px 0;line-height:1.6">Margin scale, not padding: same-topic 28, sibling topic 48, new subject 96. Sections get one .section-pad (56/72px) on the outer shell only.</p>
</body></html>
