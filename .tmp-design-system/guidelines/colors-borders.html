<!-- @dsCard group="Colors" viewport="700x170" name="Borders & shadows" subtitle="Hairlines do the structure; shadows stay soft" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--mist);font-family:var(--font-inter)}.row{display:flex;gap:16px}.c{background:#fff;flex:1;padding:14px;display:flex;flex-direction:column;gap:4px}b{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}small{font-size:10px;font-weight:300;color:var(--stone)}</style></head>
<body><div class="row">
<div class="c" style="border:1px solid var(--border-soft)"><b>Hairline</b><small>1px #e4ddd7 — every card, rule and panel edge</small></div>
<div class="c" style="border:1px solid var(--border-soft);box-shadow:var(--shadow-soft)"><b>shadow-soft</b><small>0 2px 12px rgba(13,13,13,.05) — hover lift</small></div>
<div class="c" style="border:1px solid var(--border-soft);box-shadow:var(--shadow-card)"><b>shadow-card</b><small>0 8px 32px rgba(13,13,13,.08) — raised cards</small></div>
<div class="c" style="border:1px dashed rgba(13,13,13,.3)"><b>Dashed</b><small>"view all" variant only</small></div>
</div>
<p style="margin:14px 2px 0;font-size:10px;color:var(--stone)">Corners are square — radius 0–2px everywhere. No pills, no rounded cards.</p></body></html>
